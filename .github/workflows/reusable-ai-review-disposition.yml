name: Reusable - AI Review Disposition

on:
  workflow_call:
    inputs:
      bot-logins:
        description: 'Comma-separated GitHub logins; every bot must complete review'
        required: true
        type: string
      pr-number:
        description: 'Positive PR number to check in the caller repository'
        required: false
        type: number
        default: 0
      all-open-prs:
        description: 'Explicitly recheck every open PR after an issue changes'
        required: false
        type: boolean
        default: false
      shared-ref:
        description: 'Revision of the shared CI scripts; defaults to main'
        required: false
        type: string
        default: main

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  disposition:
    name: Evaluate AI Review Dispositions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep the newest evaluation for this PR; other PRs run independently.
    concurrency:
      group: ai-review-disposition-${{ github.repository }}-${{ inputs.all-open-prs && 'all-open-prs' || inputs.pr-number }}
      cancel-in-progress: true
    steps:
    - name: Checkout trusted shared scripts
      uses: actions/checkout@v4
      with:
        repository: IS-Model-Framework/.github
        ref: ${{ inputs.shared-ref }}
        path: .ci-shared
        persist-credentials: false
        sparse-checkout: scripts

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Publish check on the target PR head commit
      env:
        GH_TOKEN: ${{ github.token }}
        AI_REVIEW_BOTS: ${{ inputs.bot-logins }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ALL_OPEN_PRS: ${{ inputs.all-open-prs }}
      run: |
        if [[ "$ALL_OPEN_PRS" == "true" ]]; then
          python .ci-shared/scripts/check_ai_review_disposition.py --all-open-prs
        else
          python .ci-shared/scripts/check_ai_review_disposition.py --pr-number "$PR_NUMBER"
        fi
