name: Reusable - Tests

on:
  workflow_call:
    inputs:
      pytest-runner:
        description: 'Optional repository Python runner for PR dependency tests'
        required: false
        type: string
        default: ''
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      install-command:
        description: 'Command to install project dependencies'
        required: false
        type: string
        default: 'pip install -e ".[dev]"'
      upload-coverage:
        description: 'Whether to upload coverage to codecov'
        required: false
        type: boolean
        default: true
      comment-on-pr:
        description: 'Post coverage comment on Pull Requests'
        required: false
        type: boolean
        default: true
    secrets:
      proton_samples_token:
        required: false

jobs:
  comprehensive-tests:
    runs-on: ubuntu-latest
    name: ${{ github.event_name == 'pull_request' && inputs.pytest-runner != '' && 'Core Dependency Tests' || 'Comprehensive Tests' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        repository: ${{ github.repository }}
        submodules: recursive
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install dependencies
      env:
        GIT_CONFIG_COUNT: ${{ secrets.proton_samples_token != '' && '4' || '0' }}
        GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.proton_samples_token }}@github.com/IS-Model-Framework/ProtonSamples.insteadOf'
        GIT_CONFIG_VALUE_0: 'https://github.com/IS-Model-Framework/ProtonSamples'
        GIT_CONFIG_KEY_1: 'url.https://x-access-token:${{ secrets.proton_samples_token }}@github.com/IS-Model-Framework/PallasKernels.insteadOf'
        GIT_CONFIG_VALUE_1: 'https://github.com/IS-Model-Framework/PallasKernels'
        GIT_CONFIG_KEY_2: 'url.https://x-access-token:${{ secrets.proton_samples_token }}@github.com/IS-Model-Framework/ProtonFramework.insteadOf'
        GIT_CONFIG_VALUE_2: 'https://github.com/IS-Model-Framework/ProtonFramework'
        GIT_CONFIG_KEY_3: 'url.https://x-access-token:${{ secrets.proton_samples_token }}@github.com/IS-Model-Framework/Pallas_training.insteadOf'
        GIT_CONFIG_VALUE_3: 'https://github.com/IS-Model-Framework/Pallas_training'
        GIT_TERMINAL_PROMPT: '0'
      run: |
        python -m pip install --upgrade pip
        ${{ inputs.install-command }}
    
    - name: Run tests and generate reports
      id: run-tests
      env:
        PYTEST_RUNNER: ${{ inputs.pytest-runner }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PYTEST_PLAN_PATH: ${{ runner.temp }}/unit-test-plan.json
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        pytest_args=(
          --cov=.
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          --junitxml=pytest.xml
          -v -s --tb=short
        )
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PYTEST_RUNNER" && -f "$PYTEST_RUNNER" ]]; then
          python -- "$PYTEST_RUNNER" "${pytest_args[@]}"
        else
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PYTEST_RUNNER" ]]; then
            echo "::warning::Pytest runner unavailable; running full pytest"
          fi
          pytest "${pytest_args[@]}"
        fi

    - name: Save dependency test plan
      if: ${{ always() && github.event_name == 'pull_request' && inputs.pytest-runner != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: core-dependency-tests-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/unit-test-plan.json
          ${{ runner.temp }}/unit-test-selection-candidate.json
          pytest.xml
          coverage.xml
        if-no-files-found: warn
    
    - name: Pytest coverage comment
      # 仅在 input 启用时，并且仅在 pull_request 事件上运行
      if: ${{ inputs.comment-on-pr && github.event_name == 'pull_request' }}
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-xml-coverage-path: ./coverage.xml
        junitxml-path: ./pytest.xml
    
    - name: Upload coverage
      if: ${{ inputs.upload-coverage }}
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
