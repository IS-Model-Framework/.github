# Copy to each project's .github/workflows/ai-review-disposition.yml.
# Both this file and the event collector must exist on the default branch.
name: AI Review Disposition

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_run:
    workflows: [AI Review Events]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [closed, reopened, deleted, transferred]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Positive PR number; leave 0 when rechecking all open PRs'
        required: false
        type: number
        default: 0
      all-open-prs:
        description: 'Explicitly recheck all open PRs after automated Issue changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  disposition:
    if: >-
      ${{ github.event_name != 'issues'
          && !(github.event_name == 'workflow_dispatch' && inputs.all-open-prs)
          && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
          && (github.event_name != 'pull_request_target'
              || github.event.action != 'edited' || github.event.changes.base) }}
    uses: IS-Model-Framework/.github/.github/workflows/reusable-ai-review-disposition.yml@main
    with:
      # Collector run-name is the PR number, even when workflow_run.pull_requests is empty.
      pr-number: >-
        ${{ github.event.pull_request.number
            || github.event.issue.number
            || fromJSON(inputs.pr-number || '0')
            || fromJSON(github.event.workflow_run.display_title || '0') }}
      # Set this repository/organization variable to exact bot logins.
      bot-logins: ${{ vars.AI_REVIEW_BOTS }}
      shared-ref: main

  issue-recheck:
    if: >-
      ${{ github.event_name == 'issues'
          || (github.event_name == 'workflow_dispatch' && inputs.all-open-prs) }}
    uses: IS-Model-Framework/.github/.github/workflows/reusable-ai-review-disposition.yml@main
    with:
      all-open-prs: true
      bot-logins: ${{ vars.AI_REVIEW_BOTS }}
      shared-ref: main
