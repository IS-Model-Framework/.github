# Optional example for automation that closes Issues using GITHUB_TOKEN.
# Copy to the target repository; the normal caller must be on its default branch.
name: Close Issue and Recheck AI Dispositions

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Positive Issue number to close in this repository'
        required: true
        type: number

permissions:
  issues: write
  actions: write

jobs:
  close-and-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Close the Issue and dispatch the existing caller
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
          echo "A positive integer Issue number is required" >&2
          exit 1
        }
        is_pr=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq 'has("pull_request")')
        if [[ "$is_pr" == "true" ]]; then
          echo "Use an Issue, not a pull request" >&2
          exit 1
        fi
        gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
          --method PATCH -f state=closed > /dev/null
        # Issue events from GITHUB_TOKEN do not start Actions; dispatch does.
        # Reuse the same caller and its repository-wide writer queue.
        gh workflow run ai-review-disposition.yml --repo "$GITHUB_REPOSITORY" \
          --ref "$DEFAULT_BRANCH" -f all-open-prs=true
