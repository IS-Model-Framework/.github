# Test-repository-only experiment. Never add this check to production rulesets.
name: AI Review Latest Result Lab

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Open test PR number in this test repository'
        required: true
        type: number
      scenario:
        description: 'The result that B must retain after A writes late'
        required: true
        type: choice
        default: B-success
        options: [B-success, B-failure, B-cancelled]
      pause-seconds:
        description: 'Pause with B pending so you can inspect the merge box (0-60)'
        required: false
        type: number
        default: 15

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  experiment:
    if: ${{ vars.AI_REVIEW_SANDBOX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-review-latest-result-lab-${{ github.repository }}-${{ inputs.pr-number }}
      cancel-in-progress: false
    steps:
    - name: Checkout the exact candidate scripts
      uses: actions/checkout@v4
      with:
        repository: IS-Model-Framework/.github
        ref: ${{ vars.AI_REVIEW_TEST_REF || 'feat/Ai-dispose' }}
        path: .ci-shared
        persist-credentials: false
        sparse-checkout: scripts
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Exercise the real Checks API with a deliberately late A result
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SCENARIO: ${{ inputs.scenario }}
        PAUSE_SECONDS: ${{ inputs.pause-seconds }}
      run: |
        python - <<'PY'
        import os
        import sys
        import time
        from urllib.parse import quote

        sys.path.insert(0, '.ci-shared')
        from scripts import check_ai_review_disposition as checker

        # Isolate fixture checks from the real evaluator's required check.
        checker.CHECK_NAME = 'AI Review / Disposition Integration Test'
        api = checker.GitHub(os.environ['GH_TOKEN'])
        repository = os.environ['GITHUB_REPOSITORY']
        number = int(os.environ['PR_NUMBER'])
        pause = int(os.environ['PAUSE_SECONDS'])
        if number <= 0 or not 0 <= pause <= 60:
            raise ValueError('Positive PR number and pause between 0 and 60 required')
        outcomes = {
            'B-success': ('success', 'failure'),
            'B-failure': ('failure', 'success'),
            'B-cancelled': ('cancelled', 'success'),
        }
        expected, late_result = outcomes[os.environ['SCENARIO']]
        pr = api.request('GET', f'/repos/{repository}/pulls/{number}')
        if (pr['state'] != 'open'
            or not pr['head']['ref'].startswith('test/ai-review-e2e-')
            or pr['base']['ref'] != 'test/ai-review-merge-target'):
            raise ValueError('Use an open test PR')
        head = pr['head']['sha']
        generation = int(os.environ['GITHUB_RUN_NUMBER'])
        attempt = int(os.environ['GITHUB_RUN_ATTEMPT']) * 2

        def create(attempt_number):
            return api.request('POST', f'/repos/{repository}/check-runs', {
                'name': checker.CHECK_NAME,
                'head_sha': head,
                'status': 'in_progress',
                'external_id': f'ai-review-disposition:{number}:{generation}:{attempt_number}',
            })

        def finish(check, conclusion):
            # As in production, finishing never sets the check's name.
            api.request('PATCH', f"/repos/{repository}/check-runs/{check['id']}", {
                'status': 'completed',
                'conclusion': conclusion,
                'output': {'title': f'Lab result: {conclusion}', 'summary': 'Sandbox fixture check.'},
            })

        def gate():
            name = quote(checker.CHECK_NAME, safe='')
            checks = api.pages(
                f'/repos/{repository}/commits/{head}/check-runs?check_name={name}&filter=all',
                'check_runs',
            )
            return [c for c in checks if c['app']['id'] == newer['app']['id']]

        older = create(attempt - 1)
        assert checker.current_check(api, repository, number, head, older)
        finish(older, 'success')
        newer = create(attempt)
        assert checker.current_check(api, repository, number, head, newer)
        checks = gate()
        assert len(checks) == 1 and checks[0]['id'] == newer['id']
        assert checks[0]['status'] == 'in_progress'
        print(f"B is pending for {pause}s. Inspect PR #{number}'s merge box now.", flush=True)
        time.sleep(pause)

        finish(newer, expected)
        # This deliberately bypasses A's final ownership test to simulate a request
        # already sent before cancellation, but received after B's final result.
        finish(older, late_result)
        checks = gate()
        assert len(checks) == 1 and checks[0]['id'] == newer['id']
        assert checks[0]['conclusion'] == expected
        assert not checker.current_check(api, repository, number, head, older)
        print(f"PASS: B remains {expected}; A's late {late_result} did not take over.")
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
            report.write(
                f'## Latest-result experiment passed\n\n'
                f'PR: {pr["html_url"]}\n\n'
                f'Head: `{head}`\n\n'
                f'Expected and actual required fixture check: **{expected}**.\n\n'
                f'A wrote **{late_result}** after B. Only B retains the fixed check name.\n\n'
                f'The experiment job succeeds when the assertions hold; '
                f'the fixture check itself intentionally reflects the selected B result.\n'
            )
        PY
