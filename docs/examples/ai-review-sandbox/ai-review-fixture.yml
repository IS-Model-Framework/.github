# Test-only actor. This is GitHub Actions, not Codex or Infiscale.
name: AI Review Sandbox Fixture
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Disposable test PR number'
        required: true
        type: number
      with-finding:
        description: 'Create one inline finding to exercise disposition replies'
        required: true
        type: boolean
        default: true
      operation:
        description: 'Explicit fixture action; never impersonates a human'
        required: true
        type: choice
        default: create-review
        options: [create-review, reply, edit-root]
      target-comment-id:
        description: 'Existing github-actions root comment ID for reply/edit'
        required: false
        type: number
        default: 0
permissions:
  contents: read
  pull-requests: write
jobs:
  fixture:
    if: ${{ vars.AI_REVIEW_SANDBOX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Publish an explicitly labelled fixture review
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        WITH_FINDING: ${{ inputs.with-finding }}
        OPERATION: ${{ inputs.operation }}
        TARGET_COMMENT_ID: ${{ inputs.target-comment-id }}
      run: |
        python - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen

        repo = os.environ['GITHUB_REPOSITORY']
        number = int(os.environ['PR_NUMBER'])
        if number <= 0:
            raise ValueError('Authorized test repository and positive PR required')

        def api(path, body=None, method=None):
            request = Request('https://api.github.com/repos/' + repo + path,
                method=method or ('POST' if body is not None else 'GET'),
                data=json.dumps(body).encode() if body is not None else None,
                headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Accept': 'application/vnd.github+json',
                         'Content-Type': 'application/json'})
            with urlopen(request, timeout=30) as response:
                return json.load(response)

        pr = api(f'/pulls/{number}')
        if (pr['state'] != 'open'
            or not pr['head']['ref'].startswith('test/ai-review-e2e-')
            or pr['base']['ref'] != 'test/ai-review-merge-target'):
            raise ValueError('Use only an open disposable fixture PR')
        operation = os.environ['OPERATION']
        if operation in {'reply', 'edit-root'}:
            target = int(os.environ['TARGET_COMMENT_ID'])
            root = api(f'/pulls/comments/{target}')
            if (root['user']['login'] != 'github-actions[bot]'
                or root.get('in_reply_to_id')
                or root['pull_request_url'] != f'https://api.github.com/repos/{repo}/pulls/{number}'):
                raise ValueError('Use only this fixture bot\'s own root on the selected PR')
            if operation == 'reply':
                result = api(f'/pulls/{number}/comments/{target}/replies', {
                    'body': 'Disposition: Rejected\nReason: SANDBOX bot reply must not satisfy a human response.',
                })
            else:
                result = api(f'/pulls/comments/{target}', {
                    'body': 'SANDBOX FIXTURE: edited original finding. Existing human disposition '
                            'must remain valid; no repeated confirmation is required.',
                }, method='PATCH')
            print('Fixture action:', operation, result['html_url'])
            raise SystemExit(0)
        if operation != 'create-review':
            raise ValueError('Unknown fixture operation')
        review = {
            'commit_id': pr['head']['sha'], 'event': 'COMMENT',
            'body': 'SANDBOX FIXTURE: a GitHub Actions review for API/policy testing. '
                    'This is not an Infiscale or Codex review.',
        }
        if os.environ['WITH_FINDING'] == 'true':
            review['comments'] = [{
                'path': '.ai-review-sandbox/sample.py', 'line': 5, 'side': 'RIGHT',
                'body': 'SANDBOX FIXTURE: record an explicit disposition for this test value. '
                        'This is not a real AI finding.',
            }]
        created = api(f'/pulls/{number}/reviews', review)
        print('Fixture review:', created['html_url'])
        PY
