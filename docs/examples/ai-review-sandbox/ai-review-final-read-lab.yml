# Test-only controlled timing experiment; never a production required check.
name: AI Review Final Read Lab
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Disposable test PR number'
        type: number
        required: true
      issue-number:
        description: 'Open disposable Issue currently referenced by Deferred'
        type: number
        required: true
      root-comment-id:
        description: 'Existing fixture bot root comment on that PR'
        type: number
        required: true
      scenario:
        description: 'Mutation immediately after the first external lookup'
        type: choice
        required: true
        options: [issue-close, review-edit]
permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write
  checks: write
jobs:
  experiment:
    if: ${{ vars.AI_REVIEW_SANDBOX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-review-final-read-lab-${{ github.repository }}-${{ inputs.pr-number }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        repository: IS-Model-Framework/.github
        ref: ${{ vars.AI_REVIEW_TEST_REF || 'feat/Ai-dispose' }}
        path: .ci-shared
        persist-credentials: false
        sparse-checkout: scripts
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Verify real final reads with a controlled concurrent mutation
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        ROOT_COMMENT_ID: ${{ inputs.root-comment-id }}
        SCENARIO: ${{ inputs.scenario }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        python - <<'PY'
        import os
        import subprocess
        import sys
        from urllib.parse import quote
        sys.path.insert(0, '.ci-shared')
        from scripts import check_ai_review_disposition as checker

        repository = os.environ['GITHUB_REPOSITORY']
        number = int(os.environ['PR_NUMBER'])
        issue_number = int(os.environ['ISSUE_NUMBER'])
        root_id = int(os.environ['ROOT_COMMENT_ID'])
        scenario = os.environ['SCENARIO']
        assert min(number, issue_number, root_id) > 0
        checker.CHECK_NAME = 'AI Review / Final Read Integration Test'
        real = checker.GitHub(os.environ['GH_TOKEN'])
        pr = real.request('GET', f'/repos/{repository}/pulls/{number}')
        assert pr['state'] == 'open' and pr['head']['ref'].startswith('test/ai-review-e2e-')
        assert pr['base']['ref'] == 'test/ai-review-merge-target'
        issue_path = f'/repos/{repository}/issues/{issue_number}'
        issue = real.request('GET', issue_path)
        assert issue['state'] == 'open' and issue['title'].startswith('[Sandbox disposable]')
        assert 'pull_request' not in issue
        root_path = f'/repos/{repository}/pulls/comments/{root_id}'
        root = real.request('GET', root_path)
        assert root['user']['login'] == 'github-actions[bot]'
        assert root['pull_request_url'] == f'https://api.github.com/repos/{repository}/pulls/{number}'

        class MutatingAPI(checker.GitHub):
            lookups = 0
            def request(self, method, path, body=None):
                result = super().request(method, path, body)
                if method == 'GET' and path == issue_path:
                    self.lookups += 1
                    if self.lookups == 1:
                        # Return the real open response read just before the mutation.
                        # The candidate itself must detect the change on its final read.
                        if scenario == 'issue-close':
                            super().request('PATCH', issue_path, {'state': 'closed'})
                        elif scenario == 'review-edit':
                            super().request('PATCH', root_path, {
                                'body': 'SANDBOX FIXTURE: changed during evaluation, run '
                                        + os.environ['GITHUB_RUN_ID'],
                            })
                        else:
                            raise ValueError('Unknown scenario')
                return result

        api = MutatingAPI(os.environ['GH_TOKEN'])
        assert checker.check_pr(api, repository, number, {'github-actions[bot]'}) is False
        name = quote(checker.CHECK_NAME, safe='')
        checks = api.pages(f'/repos/{repository}/commits/{pr["head"]["sha"]}/check-runs'
                           f'?check_name={name}&filter=all', 'check_runs')
        current = max(checks, key=lambda check: check['id'])
        assert current['conclusion'] == 'failure'
        if scenario == 'issue-close':
            assert api.lookups == 2
            assert 'Tracking must reference' in current['output']['summary']
        else:
            assert 'PR review data changed during evaluation' in current['output']['summary']
        print('PASS:', scenario, 'was detected; stale success was refused.')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
            report.write(f'Controlled real-API final-read test passed: **{scenario}**.\n\n'
                         f'Issue lookups: {api.lookups}. Fixture Check deliberately failed.\n')
        # Our own Issue mutation also uses GITHUB_TOKEN: refresh the real gate.
        subprocess.run([
            'gh', 'workflow', 'run', 'ai-review-disposition.yml', '--repo', repository,
            '--ref', os.environ['DEFAULT_BRANCH'], '-f', 'all-open-prs=true',
        ], check=True)
        PY
